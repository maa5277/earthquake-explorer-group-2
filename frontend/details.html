<!DOCTYPE html>
<html>
<head>
    <title>Earthquake Details</title>

    <style>
    body {
        font-family: Arial, sans-serif;
        max-width: 900px;
        margin: auto;
        padding: 20px;
    }

    p {
        font-size: 18px;
    }
    </style>
    
</head>
<body>

<h1>Earthquake Details</h1>

<div id="details"></div>
<hr>

<h3>Comments</h3>

<input id="username" placeholder="Name">

<br><br>

<textarea id="comment" rows="4" cols="40"></textarea>

<br><br>

<button onclick="addComment()">Add Comment</button>

<div id="comments"></div>
    
<script>

const params = new URLSearchParams(window.location.search);
const id = params.get("id");
const earthquakeId = id;

fetch("http://172.16.1.111:3001/api/earthquake/" + id)
.then(response => response.json())
.then(eq => {

    document.getElementById("details").innerHTML = `
        <p><strong>Location:</strong> ${eq.place}</p>
        <p><strong>State:</strong> ${eq.state}</p>
        <p><strong>Magnitude:</strong> ${eq.magnitudo}</p>
        <p><strong>Depth:</strong> ${eq.depth}</p>
        <p><strong>Date:</strong> ${eq.date}</p>
        <p><strong>Status:</strong> ${eq.status}</p>
        <p><strong>Tsunami:</strong> ${eq.tsunami}</p>
    `;
});
    
    async function addComment() {

    await fetch("http://172.16.1.111:3001/api/comments", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            earthquakeId: earthquakeId,
            username: document.getElementById("username").value,
            comment: document.getElementById("comment").value
        })
    });

    alert("Comment added");
}

</script>

</body>
</html>
