<!DOCTYPE html>
<html>
<head>
    <title>Earthquake Explorer</title>

    <style>
    body {
        font-family: Arial, sans-serif;
        max-width: 900px;
        margin: auto;
        padding: 20px;
    }

    input, button {
        padding: 8px;
        margin: 5px;
    }

    button {
        cursor: pointer;
    }
    </style>
    
</head>
<body>

<h1>Earthquake Explorer</h1>

<input id="searchBox" type="text" placeholder="Search earthquakes">
<button onclick="search()">Search</button>
<br><br>

<input id="lat" placeholder="Latitude">
<input id="lng" placeholder="Longitude">

<button onclick="nearby()">
Nearby Search
</button>

<script>
function search() {
    const q = document.getElementById("searchBox").value;
    window.location.href = "results.html?q=" + encodeURIComponent(q);
}

function nearby() {

    const lat = document.getElementById("lat").value;
    const lng = document.getElementById("lng").value;

    window.location.href =
        "results.html?lat=" + lat + "&lng=" + lng;
}
</script>

</body>
</html>
