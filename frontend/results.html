<!DOCTYPE html>
<html>
<head>
    <title>Results</title>

    <style>
    body {
        font-family: Arial, sans-serif;
        max-width: 900px;
        margin: auto;
        padding: 20px;
    }

    a {
        text-decoration: none;
        font-size: 18px;
    }

    div {
        margin-bottom: 10px;
    }

    button {
        padding: 8px;
    }
    </style>

</head>
<body>

<h1>Search Results</h1>
    
<button onclick="window.location.href='index.html'">
Search Again
</button>
<div id="results"></div>

<script>
const params = new URLSearchParams(window.location.search);

const q = params.get("q");
const lat = params.get("lat");
const lng = params.get("lng");

let url;

if (lat && lng) {
    url =
    "http://172.16.1.111:3001/api/nearby?lat=" +
    lat +
    "&lng=" +
    lng;
}
else {
    url =
    "http://172.16.1.111:3001/api/search?q=" +
    q;
}

fetch(url)
.then(response => response.json())
.then(data => {

    let html = "";

    data.forEach(eq => {

        html += `
        <div>
            <a href="details.html?id=${eq._id}">
                ${eq.place || "Unknown Location"}
            </a>
        </div>
        `;
    });

    document.getElementById("results").innerHTML = html;
});
</script>

</body>
</html>
